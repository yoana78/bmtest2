name = "boomyung-site"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "boomyung-siteb-db"
database_id = "5207e6d6-eb0f-40ce-8f46-cc458d85a22a"

[ai]
binding = "AI"

# ADMIN_PASSWORD is set as a secret (not in this file):
#   npx wrangler pages secret put ADMIN_PASSWORD --project-name=bmtest2
#
# If the D1 binding above isn't picked up automatically by a git-triggered
# Pages build, add it manually once in the dashboard:
# Workers & Pages -> bmtest2 -> Settings -> Functions -> D1 database bindings
# -> variable name "DB" bound to "boomyung-siteb-db".
